name: Update current release

on:
  schedule:
    - cron: "7 2 * * *"  # 02:07 UTC daily
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate current.json
        run: python3 generate_current_release.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current.json
          git diff --cached --quiet || git commit -m "Update current release"
          git push
